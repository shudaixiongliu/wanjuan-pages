<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 合同审核协作</title>
    <script src="./reference/iconpark-41579.js"></script>
    <style>
        :root {
            --primary: #4e50f0;
            --primary-soft: rgba(78, 80, 240, 0.08);
            --primary-line: rgba(78, 80, 240, 0.18);
            --violet: #4e50f0;
            --text-1: #101828;
            --text-2: #344054;
            --text-3: #98a2b3;
            --line: #e4e7ec;
            --line-soft: #eef2f6;
            --bg-page: #f5f7fb;
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-page);
            color: var(--text-1);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        iconpark-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            flex: 0 0 auto;
        }

        .page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: 64px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .back-btn:hover,
        .export-btn:hover,
        .action-btn:hover,
        .apply-btn:hover,
        .ai-btn:hover,
        .close-btn:hover,
        .send-btn:hover,
        .ai-apply-btn:hover {
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.10);
        }

        .top-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .top-title strong {
            font-size: 16px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-title span {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            height: 32px;
            padding: 0 12px;
            border-radius: 6px;
            border: none;
            background: #fff;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .export-btn {
            height: 32px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }

        .workspace {
            flex: 1;
            min-height: 0;
            height: calc(100vh - 64px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 8px var(--audit-width, 432px) 8px var(--ai-width, 320px);
            overflow: hidden;
            align-items: stretch;
        }

        .workspace.ai-collapsed {
            grid-template-columns: minmax(0, 1fr) 8px var(--audit-width, 432px) 0 0;
        }

        .editor-panel {
            min-width: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .editor-shell {
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: #fff;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            height: 40px;
            padding: 0 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
            font-size: 12px;
            color: var(--text-2);
        }

        .toolbar .active {
            color: var(--primary);
            font-weight: 600;
        }

        .formatbar {
            min-height: 48px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #fff;
        }

        .format-dd {
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #fff;
            font-size: 12px;
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .format-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-2);
            cursor: pointer;
        }

        .format-btn.active,
        .format-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        .format-sep {
            width: 1px;
            height: 18px;
            background: var(--line);
        }

        .canvas {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #f7f8fa;
            padding: 16px;
        }

        .paper {
            width: 100%;
            max-width: 860px;
            min-height: 980px;
            margin: 0 auto;
            padding: 56px 68px 72px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #fff;
            box-shadow: var(--shadow-sm);
        }

        .paper h2 {
            margin: 0 0 28px;
            text-align: center;
            font-size: 28px;
            line-height: 1.3;
        }

        .doc-meta {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 10px;
            color: var(--text-2);
        }

        .doc-text {
            font-size: 16px;
            line-height: 2;
            margin: 18px 0;
            transition: 0.2s ease;
        }

        .doc-text.highlight {
            padding-left: 10px;
            border-left: 3px solid var(--primary);
            background: rgba(78, 80, 240, 0.06);
        }

        .doc-text.focused {
            border-left-color: var(--primary);
            background: rgba(78, 80, 240, 0.08);
            box-shadow: inset 0 0 0 1px rgba(78, 80, 240, 0.12);
        }

        .doc-text.locating {
            box-shadow: inset 0 0 0 1px rgba(78, 80, 240, 0.14), 0 0 0 6px rgba(78, 80, 240, 0.10);
        }

        .doc-placeholder {
            color: var(--text-3);
            font-style: italic;
        }

        .rev-del {
            margin: 0 4px;
            color: #98a2b3;
            text-decoration: line-through;
        }

        .rev-add {
            margin: 0 4px;
            color: #ef4444;
            text-decoration: underline;
            font-weight: 600;
        }

        .resize-handle {
            width: 8px;
            cursor: col-resize;
            position: relative;
            background: transparent;
        }

        .resize-handle::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3px;
            width: 2px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .resize-handle:hover::before,
        .resize-handle.is-dragging::before {
            background: rgba(78, 80, 240, 0.35);
        }

        .audit-panel,
        .ai-panel {
            min-width: 0;
            background: #fff;
            border-left: 1px solid var(--line);
            display: grid;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            align-self: stretch;
        }

        .audit-panel {
            min-width: 404px;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .ai-panel {
            min-width: 300px;
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        .workspace.ai-collapsed .ai-panel,
        .workspace.ai-collapsed #aiResize {
            display: none;
        }

        .panel-head {
            padding: 16px 16px 0;
            flex: 0 0 auto;
        }

        .audit-view-tabs {
            position: relative;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            border-bottom: 1px solid var(--line);
        }

        .audit-view-tab {
            appearance: none;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 28px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-3);
            font-size: 14px;
            font-weight: 400;
            line-height: 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .audit-view-tab::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: -1px;
            left: 0;
            height: 4px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .audit-view-tab.active {
            color: var(--primary);
            font-weight: 600;
        }

        .audit-view-tab.active::after {
            background: var(--primary);
        }

        .audit-body {
            min-height: 0;
            overflow: hidden;
            display: grid;
        }

        .audit-view-panel {
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .audit-view-panel.is-hidden {
            display: none;
        }

        .risk-overview-panel {
            padding: 16px 16px 16px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .risk-overview-copy {
            color: var(--text-2);
            font-size: 14px;
            line-height: 1.8;
        }

        .risk-overview-copy p {
            margin: 0 0 14px;
        }

        .risk-overview-copy p:last-child {
            margin-bottom: 0;
        }

        .risk-overview-copy strong {
            color: var(--text-1);
            font-weight: 700;
        }

        .risk-overview-empty {
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #fff;
            padding: 16px;
            color: var(--text-3);
            font-size: 12px;
            line-height: 1.7;
        }

        .risk-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 16px 16px 0;
        }

        .risk-summary-item {
            min-width: 0;
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr);
            align-items: center;
            column-gap: 8px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--line-soft);
            background: #fff;
            text-align: right;
            cursor: pointer;
            font: inherit;
            transition: 0.2s ease;
        }

        .risk-summary-item.high {
            background: linear-gradient(180deg, rgba(235, 68, 83, 0.02) 0%, rgba(235, 68, 83, 0.02) 2%, rgba(255, 255, 255, 0) 100%);
        }

        .risk-summary-item.mid {
            background: linear-gradient(180deg, rgba(235, 149, 68, 0.02) 0%, rgba(235, 149, 68, 0.02) 2%, rgba(255, 255, 255, 0) 100%);
        }

        .risk-summary-item.low {
            background: linear-gradient(180deg, rgba(26, 219, 132, 0.03) 0%, rgba(26, 219, 132, 0.03) 3%, rgba(255, 255, 255, 0) 100%);
        }

        .risk-summary-item:hover {
            border-color: var(--line-soft);
        }

        .risk-summary-item.active {
            border-color: #766BF2;
        }

        .risk-summary-label {
            display: block;
            min-width: 0;
            color: var(--text-3);
            font-size: 11px;
            line-height: 1.3;
            white-space: nowrap;
        }

        .risk-summary-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .risk-summary-item.high .risk-summary-label {
            color: #d92d20;
        }

        .risk-summary-item.mid .risk-summary-label {
            color: #b54708;
        }

        .risk-summary-item.low .risk-summary-label {
            color: #16a36a;
        }

        .risk-summary-count {
            display: block;
            margin-top: 3px;
            color: var(--text-1);
            font-size: 16px;
            font-weight: 700;
            line-height: 1.1;
            text-align: right;
        }

        .risk-summary-content {
            min-width: 0;
            text-align: right;
        }

        .tabs {
            margin-top: 12px;
            margin-right: 16px;
            margin-left: 16px;
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            padding: 4px;
            border-radius: 10px;
            background: #F7F8FA;
            border: 1px solid #EBECF4;
        }

        .tab {
            height: 28px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-2);
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .tab.active {
            color: var(--primary);
            border-color: rgba(78, 80, 240, 0.12);
            background: #fff;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(78, 80, 240, 0.10);
        }

        .tab:hover {
            color: var(--primary);
        }

        .risk-list {
            flex: 1;
            min-height: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
        }

        .risk-card {
            position: relative;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #ffffff, #fcfbff);
            padding: 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .risk-card:hover {
            border-color: rgba(78, 80, 240, 0.16);
            box-shadow: 0 12px 24px rgba(78, 80, 240, 0.08);
        }

        .risk-card.selected {
            border-color: var(--primary-line);
            background: linear-gradient(180deg, rgba(78, 80, 240, 0.08), rgba(255, 255, 255, 0.98));
            box-shadow: 0 16px 28px rgba(78, 80, 240, 0.12);
        }

        .risk-card.selected::before {
            content: "";
            position: absolute;
            left: -1px;
            top: 14px;
            bottom: 14px;
            width: 3px;
            border-radius: 0 6px 6px 0;
            background: var(--primary);
        }

        .risk-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .risk-head-main {
            min-width: 0;
            flex: 1;
        }

        .risk-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .risk-index {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            margin-top: 1px;
        }

        .risk-level-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 22px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .risk-tag,
        .state-tag {
            height: 22px;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .risk-tag.high {
            color: #d92d20;
            background: #fff1f3;
            border-color: #fecdd3;
        }

        .risk-tag.mid {
            color: #b54708;
            background: #fff7e7;
            border-color: #fedf89;
        }

        .risk-tag.low {
            color: #027a48;
            background: #ecfdf3;
            border-color: #abefc6;
        }

        .state-tag.pending {
            color: #b54708;
            background: #fff7e7;
            border-color: #fedf89;
        }

        .state-tag.done {
            color: #027a48;
            background: #ecfdf3;
            border-color: #abefc6;
        }

        .state-tag.ignored {
            color: #667085;
            background: #f8fafc;
            border-color: #d0d5dd;
        }

        .risk-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            margin: 0;
        }

        .risk-desc {
            font-size: 12px;
            line-height: 1.7;
            color: var(--text-2);
            margin-bottom: 10px;
        }

        .suggest-box {
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed #b6e4c7;
            background: #f6fffb;
            font-size: 12px;
            line-height: 1.75;
            color: var(--text-2);
            margin-bottom: 10px;
        }

        .suggest-box strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text-1);
        }

        .card-actions-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
            min-width: 0;
            overflow: visible;
        }

        .action-btn,
        .apply-btn,
        .ai-btn {
            height: 30px;
            padding: 0 8px;
            border-radius: 6px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            white-space: nowrap;
            transition: box-shadow 0.2s ease;
            flex: 0 0 auto;
        }

        .action-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text-2);
        }

        .action-btn:hover {
            color: var(--primary);
            border-color: rgba(78, 80, 240, 0.18);
            background: rgba(78, 80, 240, 0.06);
        }

        .apply-btn {
            border: none;
            background: var(--primary);
            color: #fff;
        }

        .action-btn.danger {
            border-color: #fda29b;
            color: #d92d20;
            background: #fff5f4;
        }

        .ai-btn {
            border: 1px solid rgba(78, 80, 240, 0.18);
            background: rgba(78, 80, 240, 0.06);
            color: var(--violet);
        }

        .ai-head {
            padding: 14px 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 0 0 auto;
        }

        .ai-title {
            min-width: 0;
        }

        .ai-title strong {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .ai-title span {
            font-size: 12px;
            color: var(--text-3);
            line-height: 1.6;
            display: block;
        }

        .close-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text-2);
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }

        .ai-body {
            min-height: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
        }

        .ai-msg {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .ai-msg.user {
            justify-content: flex-end;
        }

        .ai-avatar {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: rgba(78, 80, 240, 0.10);
            color: var(--violet);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex: 0 0 auto;
        }

        .ai-bubble {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
            padding: 10px;
            font-size: 12px;
            line-height: 1.75;
            color: var(--text-2);
        }

        .ai-msg.user .ai-bubble {
            background: var(--primary-soft);
            border-color: var(--primary-line);
        }

        .ai-revision {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--primary-line);
            background: rgba(78, 80, 240, 0.06);
            color: var(--text-1);
            line-height: 1.8;
        }

        .ai-apply-row {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
        }

        .ai-apply-btn {
            height: 28px;
            padding: 0 10px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }

        .ai-footer {
            padding: 12px;
            border-top: 1px solid var(--line);
            background: #fff;
            flex: 0 0 auto;
            position: relative;
            z-index: 1;
            display: block;
        }

        .ai-input-box {
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px 0 10px;
        }

        .ai-input-box input {

        function pickContractData(name) {
            const value = String(name || '').trim();

            return Object.values(CONTRACT_DATA).find((item) => item.match.some((keyword) => value.includes(keyword))) || CONTRACT_DATA.procurement;
        }

        const params = new URLSearchParams(window.location.search);

        const riskList = document.getElementById('riskList');
        const riskSummary = document.getElementById('riskSummary');
        const riskOverview = document.getElementById('riskOverview');

            docSubtitle.textContent = data.subtitle;
            document.title = `${realTitle} - AI 审核协作`;

            const parts = [`<h2>${data.docTitle}</h2>`];
            data.parties.forEach((item) => {
                parts.push(`<p class="doc-meta">${item}</p>`);
            });
            data.clauses.forEach((item) => {
                parts.push(`<p id="${item.id}" class="${item.cls}">${item.html}</p>`);
            });
            paper.innerHTML = parts.join('');
        }

        function toPlainText(html) {
            const template = document.createElement('template');
            template.innerHTML = html || '';
            return (template.content.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function renderRiskOverview() {
            const highRisks = data.risks.filter((risk) => risk.level === 'high');
            if (!riskOverview) return;
            if (!highRisks.length) {
                riskOverview.innerHTML = '<div class="risk-overview-empty">当前未发现高风险问题。</div>';
                return;
            }
            const riskParagraphs = highRisks.map((risk) => {
                const overview = String(risk.desc || '').replace(/^风险分析：/, '');
                const suggestion = toPlainText(risk.suggestion);
                return `
                    <p><strong>${escapeHtml(risk.title)}风险：</strong>${escapeHtml(overview)}${suggestion ? ` 必须立即关注并修改：${escapeHtml(suggestion)}` : ''}</p>
                `;
            }).join('');
            riskOverview.innerHTML = `
                <div class="risk-overview-copy">
                    <p>经审查，本合同存在以下重大风险，需优先关注并进行修改：</p>
                    ${riskParagraphs}
                    <p>以上风险，请核实并关注。</p>
                </div>
            `;
        }

        function renderRiskCards() {
            riskList.innerHTML = '';
            data.risks.forEach((risk) => {
                const card = document.createElement('div');
                card.className = 'risk-card';
                card.dataset.status = risk.status;
                card.dataset.level = risk.level;
                card.dataset.anchor = risk.anchor;
                card.dataset.suggestion = risk.suggestion;
                card.dataset.ai = risk.ai;
                card.innerHTML = `
                    <div class="risk-top">
                        <div class="risk-head-main">
                            <div class="risk-title-row">
                                <span class="risk-index">${risk.index}</span>
                                <div class="risk-title">${risk.title}</div>
                            </div>
                        </div>
                        <div class="risk-level-row">
                            <span class="risk-tag ${risk.level}">${risk.level === 'high' ? '高风险' : risk.level === 'mid' ? '中风险' : '低风险'}</span>
                            <span class="state-tag ${risk.status}">${risk.status === 'pending' ? '待处理' : risk.status === 'done' ? '已处理' : '已忽略'}</span>
                        </div>
                    </div>
                    <div class="risk-desc">${risk.desc}</div>
                    <div class="suggest-box"><strong>建议修订内容：</strong>${risk.suggestion}</div>
                    <div class="card-actions-row">
                        <div class="card-actions"></div>
                        <button class="ai-btn" type="button" data-ai="1">${cardIp('ai')} AI优化</button>
                    </div>
                `;
                riskList.appendChild(card);
            });

            riskCards = Array.from(riskList.querySelectorAll('.risk-card'));
            riskCards.forEach((card) => renderCardActions(card, card.dataset.status || 'pending'));
        }

        function updateRiskSummaryCounts() {
            const counts = { high: 0, mid: 0, low: 0 };
            riskCards.forEach((card) => {
                const level = card.dataset.level || '';
                if (Object.prototype.hasOwnProperty.call(counts, level)) {
                    counts[level] += 1;
                }
            });
            riskSummary?.querySelectorAll('[data-level-count]').forEach((item) => {
                const level = item.dataset.levelCount || '';
                item.textContent = String(counts[level] || 0);
            });
        }

        function updateLevelFilterState() {
            riskSummary?.querySelectorAll('[data-level-filter]').forEach((item) => {
                const active = item.dataset.levelFilter === currentLevelFilter;
                item.classList.toggle('active', active);
                item.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
        }

        function renderCardActions(card, status) {
            const actions = card.querySelector('.card-actions');
            if (!actions) return;
            if (status === 'done') {
                actions.innerHTML = `
                    <button class="action-btn" type="button" data-action="locate">${cardIp('search')} 定位</button>
                    <button class="action-btn danger" type="button" data-action="revert">${cardIp('relog')} 撤回修改</button>
                    <button class="action-btn" type="button" data-action="comment">${cardIp('edit')} 批注</button>
                `;
                return;
            }
            if (status === 'ignored') {
                actions.innerHTML = `
                    <button class="action-btn" type="button" data-action="locate">${cardIp('search')} 定位</button>
                    <button class="apply-btn" type="button" data-action="apply">${cardIp('yes')} 同意修改</button>
                    <button class="action-btn" type="button" data-action="comment">${cardIp('edit')} 批注</button>
                    <button class="action-btn" type="button" data-action="unignore">${cardIp('eyes')} 取消忽略</button>
                `;
                return;
            }
            actions.innerHTML = `
                <button class="action-btn" type="button" data-action="locate">${cardIp('search')} 定位</button>
                <button class="apply-btn" type="button" data-action="apply">${cardIp('yes')} 同意修改</button>
                <button class="action-btn" type="button" data-action="comment">${cardIp('edit')} 批注</button>
                <button class="action-btn" type="button" data-action="ignore">${cardIp('eyes1')} 忽略</button>
            `;
        }

        function focusClause(anchorId) {
            document.querySelectorAll('.doc-text.focused').forEach((el) => el.classList.remove('focused'));
            const target = anchorId ? document.getElementById(anchorId) : null;
            if (target) target.classList.add('focused');
        }

        function selectCard(card) {
            riskCards.forEach((item) => item.classList.remove('selected'));
            if (!card) return;
            card.classList.add('selected');
            focusClause(card.dataset.anchor || '');
        }

        function locateCard(card) {
            const anchorId = card.dataset.anchor || '';
            const target = anchorId ? document.getElementById(anchorId) : null;
            if (!target) {
                alert('未找到对应条款位置');
                return;
            }
            selectCard(card);
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('locating');
            window.setTimeout(() => target.classList.remove('locating'), 900);
        }

        function applyRevision(card, html) {
            const anchorId = card.dataset.anchor || '';
            const target = anchorId ? document.getElementById(anchorId) : null;
            if (!target) {
                alert('未找到对应条款位置');
                return false;
            }
            if (!card.dataset.beforeHtml) card.dataset.beforeHtml = target.innerHTML;
            target.innerHTML = html;
            return true;
        }

        function revertRevision(card) {
            const anchorId = card.dataset.anchor || '';
            const target = anchorId ? document.getElementById(anchorId) : null;
            if (!target || !card.dataset.beforeHtml) {
                alert('没有可撤回的修改记录');
                return false;
            }
            target.innerHTML = card.dataset.beforeHtml;
            delete card.dataset.beforeHtml;
            return true;
        }

        function updateTabCounts() {
            const total = riskCards.length;
            const pending = riskCards.filter((card) => card.dataset.status === 'pending').length;
            const done = riskCards.filter((card) => card.dataset.status === 'done').length;
            const ignored = riskCards.filter((card) => card.dataset.status === 'ignored').length;
            tabs.forEach((tab) => {
                const filter = tab.dataset.filter || 'all';
                const label = filter === 'all' ? '全部' : filter === 'pending' ? '待处理' : filter === 'done' ? '已处理' : '已忽略';
                const count = filter === 'all' ? total : filter === 'pending' ? pending : filter === 'done' ? done : ignored;
                tab.textContent = `${label} ${count}`;
            });
        }

        function applyFilter(filter) {
            currentFilter = filter;
            tabs.forEach((tab) => tab.classList.toggle('active', (tab.dataset.filter || 'all') === filter));
            riskCards.forEach((card) => {
                const matchesStatus = filter === 'all' ? true : card.dataset.status === filter;
                const matchesLevel = currentLevelFilter ? card.dataset.level === currentLevelFilter : true;
                const visible = matchesStatus && matchesLevel;
                card.style.display = visible ? '' : 'none';
            });
            updateLevelFilterState();
            const firstVisible = riskCards.find((card) => card.style.display !== 'none');
            if (firstVisible) {
                selectCard(firstVisible);
            } else {
                riskCards.forEach((item) => item.classList.remove('selected'));
                document.querySelectorAll('.doc-text.focused').forEach((el) => el.classList.remove('focused'));
            }
        }

        function setAuditView(view) {
            const next = view === 'all' ? 'all' : 'overview';
            auditViewTabs.forEach((tab) => {
                const active = tab.dataset.auditView === next;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            Object.entries(auditViewPanels).forEach(([key, panel]) => {
                panel?.classList.toggle('is-hidden', key !== next);
            });
        }

        function pushAiMessage(text, isUser) {
            const wrap = document.createElement('div');
            wrap.className = `ai-msg${isUser ? ' user' : ''}`;
            if (isUser) {
                wrap.innerHTML = `<div class="ai-bubble">${text}</div>`;
            } else {
                wrap.innerHTML = `<div class="ai-avatar">${ip('agent')}</div><div class="ai-bubble">${text}</div>`;
            }
            aiBody.appendChild(wrap);
            aiBody.scrollTop = aiBody.scrollHeight;
        }

        function pushAiRevision(html) {
            const wrap = document.createElement('div');
            wrap.className = 'ai-msg';
            wrap.innerHTML = `
                <div class="ai-avatar">${ip('agent')}</div>
                <div class="ai-bubble">
                    我已生成可直接替换的修订版本：
                    <div class="ai-revision">${html}</div>
                    <div class="ai-apply-row"><button class="ai-apply-btn" type="button">同意修改</button></div>
                </div>
            `;
            aiBody.appendChild(wrap);
            aiBody.scrollTop = aiBody.scrollHeight;
        }

        function openAi(card) {
            currentAiCard = card;
            aiTitle.textContent = `当前优化：${card.querySelector('.risk-title')?.textContent || ''}`;
            document.querySelector('.workspace')?.classList.remove('ai-collapsed');
            selectCard(card);
        }

        tabs.forEach((tab) => {
            tab.addEventListener('click', () => applyFilter(tab.dataset.filter || 'all'));
        });

        auditViewTabs.forEach((tab) => {
            tab.addEventListener('click', () => setAuditView(tab.dataset.auditView || 'overview'));
        });

        riskSummary?.addEventListener('click', (e) => {
            const target = e.target;
            if (!(target instanceof HTMLElement)) return;
            const item = target.closest('[data-level-filter]');
            if (!item) return;
            const level = item.dataset.levelFilter || '';
            currentLevelFilter = currentLevelFilter === level ? '' : level;
            applyFilter(currentFilter);
        });

        riskList.addEventListener('click', (e) => {
            const target = e.target;
            if (!(target instanceof HTMLElement)) return;

            const aiBtn = target.closest('.ai-btn');
            if (aiBtn) {
                const card = aiBtn.closest('.risk-card');
                if (card) openAi(card);
                return;
            }

            const actionBtn = target.closest('[data-action]');
            if (actionBtn) {
                const card = actionBtn.closest('.risk-card');
                if (!card) return;
                const action = actionBtn.dataset.action || '';
                if (action === 'locate') {
                    locateCard(card);
                    return;
                }
                if (action === 'apply') {
                    const ok = applyRevision(card, card.dataset.suggestion || '');
                    if (!ok) return;
                    card.dataset.status = 'done';
                    renderCardActions(card, 'done');
                    updateTabCounts();
                    applyFilter(currentFilter);
                    return;
                }
                if (action === 'revert') {
                    const ok = revertRevision(card);
                    if (!ok) return;
                    card.dataset.status = 'pending';
                    renderCardActions(card, 'pending');
                    updateTabCounts();
                    applyFilter(currentFilter);
                    return;
                }
                if (action === 'ignore') {
                    card.dataset.status = 'ignored';
                    renderCardActions(card, 'ignored');
                    updateTabCounts();
                    applyFilter(currentFilter);
                    return;
                }
                if (action === 'unignore') {
                    card.dataset.status = 'pending';
                    renderCardActions(card, 'pending');
                    updateTabCounts();
                    applyFilter(currentFilter);
                    return;
                }
                if (action === 'comment') {
                    const value = window.prompt('输入批注内容：');
                    if (!value) return;
                    alert('批注已添加');
                    return;
                }
            }

            const card = target.closest('.risk-card');
            if (card) selectCard(card);
        });

        aiBody.addEventListener('click', (e) => {
            const target = e.target;
            if (!(target instanceof HTMLElement)) return;
            const applyBtn = target.closest('.ai-apply-btn');
            if (!applyBtn || !currentAiCard) return;
            const html = currentAiCard.dataset.ai || '';
            const ok = applyRevision(currentAiCard, html);
            if (!ok) return;
            currentAiCard.dataset.suggestion = html;
            const suggest = currentAiCard.querySelector('.suggest-box');
            if (suggest) suggest.innerHTML = `<strong>建议修订内容：</strong>${html}`;
            currentAiCard.dataset.status = 'done';
            renderCardActions(currentAiCard, 'done');
            updateTabCounts();
            applyFilter(currentFilter);
            applyBtn.disabled = true;
            applyBtn.textContent = '已采纳';
        });

        aiSend.addEventListener('click', () => {
            const text = (aiInput.value || '').trim();
            if (!text || !currentAiCard) return;
            pushAiMessage(text, true);
            aiInput.value = '';
            window.setTimeout(() => {
                pushAiRevision(currentAiCard.dataset.ai || '');
            }, 200);
        });

        aiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                aiSend.click();
            }
        });

        aiClose.addEventListener('click', () => {
            document.querySelector('.workspace')?.classList.add('ai-collapsed');
            aiTitle.textContent = '对当前条款的修改建议进行进一步润色与增强';
        });

        exportBtn.addEventListener('click', () => {
            alert('修订版文档已生成，原型中以提示代替实际下载。');
        });

        document.querySelectorAll('.format-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
            });
        });

        document.querySelectorAll('.toolbar span').forEach((item) => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.toolbar span').forEach((node) => node.classList.remove('active'));
                item.classList.add('active');
            });
        });

        function beginResize(type, handle) {
            dragState = { type, handle };
            handle.classList.add('is-dragging');
        }

        auditResize.addEventListener('mousedown', (e) => {
            beginResize('audit', auditResize);
            e.preventDefault();
        });

        aiResize.addEventListener('mousedown', (e) => {
            beginResize('ai', aiResize);
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!dragState) return;
            if (dragState.type === 'audit') {
                const aiWidth = document.querySelector('.workspace')?.classList.contains('ai-collapsed') ? 0 : parseInt(getComputedStyle(root).getPropertyValue('--ai-width') || '320', 10);
                const width = Math.min(492, Math.max(404, window.innerWidth - e.clientX - aiWidth - 8));
                root.style.setProperty('--audit-width', `${width}px`);
            }
            if (dragState.type === 'ai') {
                const width = Math.min(396, Math.max(300, window.innerWidth - e.clientX));
                root.style.setProperty('--ai-width', `${width}px`);
            }
        });

        document.addEventListener('mouseup', () => {
            if (!dragState) return;
            dragState.handle.classList.remove('is-dragging');
            dragState = null;
        });

        renderPaper();
        renderRiskOverview();
        renderRiskCards();
        updateRiskSummaryCounts();
        updateTabCounts();
        applyFilter('all');
        setAuditView('overview');
        if (riskCards[0]) {
            selectCard(riskCards[0]);
        }
    </script>
</body>
</html>
